# The app built for Linux, Windows and macOS, with the checks on each
# (docs/release.md).
#
#   a push to main, a pull request   the checks and the bundles, kept as the
#                                    run's artifacts for a few weeks
#   a tag v<version>                 the same, and a DRAFT release holding
#                                    every bundle: publishing it is the
#                                    owner's, on GitHub, by hand
#
# The bundles are unsigned (the owner's ruling, 2026-10-27): the README says
# how to open them on macOS and Windows.

name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux on the oldest Ubuntu GitHub still runs: the bundle needs
          # the C library it was built against, or a newer one.
          - { name: linux-x64, os: ubuntu-22.04, lint: true }
          - { name: windows-x64, os: windows-latest }
          - { name: macos-arm64, os: macos-14 }
          - { name: macos-x64, os: macos-15-intel }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      # the freeze's venv is made from the Python set up below
      ASSET_VIEWER_PYTHON: python
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0              # the version check reads main's history

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Linux packages Tauri builds against
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Python packages
        run: python -m pip install -r backend/requirements-dev.txt
      - name: npm packages
        working-directory: app
        run: npm ci

      # -- the checks (docs/development.md, "Checks"); the disc tests skip: no library here
      - name: Backend tests
        working-directory: backend
        run: python -m pytest -q
      - name: Tools' tests
        run: python -m pytest -q -p no:cacheprovider tools
      - name: Unused and undefined names
        if: matrix.lint
        run: |
          cd backend && python -m pyflakes . ../tools
          python -m decoders.inventory --check
      - name: The version moved with the work
        if: matrix.lint && github.event_name == 'pull_request'
        run: python tools/versions.py --base origin/${{ github.base_ref }}
      - name: The page
        working-directory: app
        run: |
          npm run build
          if [ '${{ matrix.lint }}' = true ]; then npm run lint; fi
      - name: The shell
        working-directory: app/src-tauri
        run: |
          cargo clippy --locked -- -D warnings
          if [ '${{ matrix.lint }}' = true ]; then cargo fmt --check; fi

      # -- the bundle: the backend frozen, the notices, the installers
      - name: Bundle
        working-directory: app
        # GitHub's Mac machines now and then fail making the disk image
        # (v0.3.0's first Intel run did, and passed when run again): a Mac
        # tries three times, saying each failure, with tauri's --verbose so
        # the disk image script says why.
        run: |
          if [ "$RUNNER_OS" != macOS ]; then exec npm run bundle; fi
          for try in 1 2 3; do
            if npm run bundle -- --verbose; then exit 0; fi
            echo "::warning::the bundle failed on try $try"
          done
          exit 1
      - name: The frozen backend runs
        run: python tools/smoke.py app/src-tauri/binaries/eternal-silver-asset-viewer-backend-*

      - name: Keep the bundles
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.name }}
          if-no-files-found: error
          path: |
            app/src-tauri/target/release/bundle/appimage/*.AppImage
            app/src-tauri/target/release/bundle/deb/*.deb
            app/src-tauri/target/release/bundle/rpm/*.rpm
            app/src-tauri/target/release/bundle/nsis/*.exe
            app/src-tauri/target/release/bundle/msi/*.msi
            app/src-tauri/target/release/bundle/dmg/*.dmg
            app/src-tauri/notices/THIRD-PARTY-NOTICES.txt

  release:
    name: draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: bundles
      # Each platform's notices, named for it: the packages differ by platform.
      # (An artifact keeps its files' paths below the folder they share,
      # app/src-tauri/.)
      - name: Name the notices
        run: |
          for d in bundles/*/; do
            n=$(basename "$d")
            mv "$d/notices/THIRD-PARTY-NOTICES.txt" "bundles/THIRD-PARTY-NOTICES-$n.txt"
          done
      - uses: softprops/action-gh-release@v3
        with:
          draft: true
          name: Eternal Silver Asset Viewer ${{ github.ref_name }}
          body: |
            Draft: the release notes go here (docs/release.md).
          files: |
            bundles/**/*.AppImage
            bundles/**/*.deb
            bundles/**/*.rpm
            bundles/**/*.exe
            bundles/**/*.msi
            bundles/**/*.dmg
            bundles/THIRD-PARTY-NOTICES-*.txt
