[package]
name = "eternal-silver-asset-viewer"
version = "0.2.5"
description = "Eternal Silver Asset Viewer — browse the assets of the Lunar games on PlayStation"
authors = ["Bash Alarmist"]
license = "MIT"
edition = "2024"

[lib]
name = "eternal_silver_asset_viewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12.1", features = [] }
tauri-plugin-dialog = "2"

[profile.release]
codegen-units = 1
lto = true
strip = true
