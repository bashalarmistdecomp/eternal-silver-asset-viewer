[pytest]
# Run from backend/:  ../.venv/bin/python3 -m pytest
pythonpath = .
testpaths = decoders viewer_tabs viewer_server
# -rs: every skip says why (a test that needs a disc the library lacks)
addopts = -rs
markers =
    disc: needs a disc of the library; skipped without it, failed without it when ASSET_VIEWER_REQUIRE_DISCS=1 (conftest.py)
